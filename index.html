    <!--
      Preloader — thanh tiến trình + số %.
      CSS INLINE có chủ đích (file ngoài để lộ màn trắng trước khi CSS tới).
      Script thì FILE NGOÀI /boot.js — CSP production đặt `script-src 'self'`,
      inline script bị chắn im lặng và preloader phủ kín app mãi mãi (bug đo
      bằng trình duyệt thật 28/09/2026). Script tự fade khi window.__bootDone()
      được gọi (xem BootSignal trong App.tsx).

      Nhân vật pixel chạy trên thanh đã BỎ (28/09/2026). Ở cỡ vẽ được trên
      thanh nó không đọc ra hình người, chỉ tốn 60 lần dựng lại lưới mỗi giây
      để nhấp nháy — rối mắt mà không nói thêm gì. Thay vào đó: LOGO CÁ VOI
      (ảnh public/logo-mark.png, dùng CHUNG với BotLogo.tsx + favicon.png),
      thanh MẢNH (4px) và một VỆT SÁNG chạy dọc thanh thuần CSS. ĐỪNG dựng lại
      nhân vật.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #111111;
        /* Vệt sáng chạy trên thanh — đổi giá trị theo chủ đề ở rule
           [data-boot="dark"] ngay bên dưới. Màu logo do chính ảnh
           public/logo-mark.png quyết định nên không còn biến cho logo. */
        --boot-sheen: rgba(255, 255, 255, 0.9);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        transition:
          opacity 0.45s ease,
          visibility 0.45s;
      }
      #boot[data-boot="dark"] {
        background: #0a0a0a;
        color: #ededed;
        /* Vệt sáng trắng đặc để còn đọc ra trên thanh xám. (Logo đảo màu bằng
           filter: invert(1) ở rule .boot-logo img bên dưới.) */
        --boot-sheen: #ffffff;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 18px;
      }
      /* Logo là ẢNH cá voi (khối bo góc tối + cá voi trắng) — giữ nguyên tỉ lệ
         ảnh, không bóp méo. */
      .boot-logo img {
        display: block;
        width: 56px;
        height: 56px;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.22));
      }
      /* Chế độ tối: ảnh chỉ có trắng + alpha nên invert(1) cho đúng cặp màu
         thương hiệu (nền sáng, cá voi tối). */
      #boot[data-boot="dark"] .boot-logo img {
        filter: invert(1) drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
      }
      .boot-in {
        /* Không còn canvas nhân vật nên không phải chừa nửa thân mỗi bên:
           lề 32px mỗi phía là đủ để thanh không chạm mép trên máy hẹp. */
        width: min(420px, calc(100vw - 64px));
        text-align: center;
      }
      .boot-mark {
        margin: 0;
        font-size: clamp(22px, 5vw, 30px);
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .boot-track {
        position: relative;
        /* Mảnh hơn (6px → 4px): thanh mỏng đọc ra tinh tế hơn hẳn thanh dày,
           và vệt sáng chạy trong lòng nó trông gọn mắt hơn. */
        height: 4px;
        margin-top: 22px;
        border-radius: 999px;
        background: rgba(17, 17, 17, 0.14);
      }
      #boot[data-boot="dark"] .boot-track {
        background: rgba(237, 237, 237, 0.18);
      }
      .boot-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        border-radius: 999px;
        background: currentColor;
        /* overflow hidden để vệt sáng (::after) bị cắt đúng trong lòng thanh,
           không tràn ra ngoài đầu thanh. */
        overflow: hidden;
        /* KHÔNG transition width ở đây: JS đã easing và đặt % mỗi frame, thêm
           một bộ easing của CSS nữa là đầu thanh trễ ~150ms so với số % bên
           dưới — hai thứ trượt lệch nhau. */
      }
      /* #ededed gần trắng nên vệt sáng trắng chạy trên nó gần như vô hình:
         hạ nền thanh chủ đề tối xuống xám để vệt sáng còn đọc ra. */
      #boot[data-boot="dark"] .boot-fill {
        background: #c8c8c8;
      }
      /* Vệt ánh sáng chạy dọc thanh: dải gradient trắng trượt từ trái sang phải
         rồi lặp. Thuần trang trí — không đụng tới % tiến trình. */
      .boot-fill::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: -40%;
        width: 40%;
        background: linear-gradient(90deg, transparent, var(--boot-sheen), transparent);
        transform: translateX(-100%);
        animation: boot-sheen 1.4s ease-in-out infinite;
      }
      @keyframes boot-sheen {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      .boot-pct {
        margin: 14px 0 0;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        letter-spacing: 0.16em;
        opacity: 0.5;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          transition: none;
        }
        /* Giảm chuyển động → tắt hẳn vệt sáng chạy (không chỉ chạy chậm). */
        .boot-fill::after {
          animation: none;
          display: none;
        }
      }
    </style>
    <noscript>
      <style>
        /* Không có JS thì không ai gọi __bootDone → không được kẹt vô preloader */
        #boot {
          display: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!--
      Preloader: markup inline + /boot.js tải riêng (chạy trước module bundle).
      Script tự báo xong; có chốt timeout để lỗi JS không kẹt người dùng.
    -->
    <div
      id="boot"
      role="progressbar"
      aria-label="Loading Protogon"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="boot-in">
        <span class="boot-logo" aria-hidden="true">
          <img src="/logo-mark.png" alt="" width="56" height="56" />
        </span>
        <p class="boot-mark">Protogon.</p>
        <div class="boot-track">
          <div class="boot-fill" id="boot-fill"></div>
        </div>
        <p class="boot-pct" id="boot-pct">0%</p>
      </div>
    </div>
    <!--
      Preloader: markup ở trên, script ở FILE NGOÀI /boot.js (CÙNG ORIGIN,
      cache được). Script chạy ngay khi parser tới đây — đúng vai trò inline
      trước đây, nhưng không vi phạm CSP script-src 'self'. Xem public/boot.js
      để biết vì sao KHÔNG được inline lại (bug production 28/09/2026).
    -->
    <script src="/boot.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
