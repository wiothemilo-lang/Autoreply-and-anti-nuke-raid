name: CI — Lint, Test & Deploy

# Chạy lint + TOÀN BỘ test suites + typecheck trên mọi push/PR vào main.
# Chặn merge khi fail — không cho code vỡ lọt vào main (trước đây deploy
# Convex tự chạy mà không qua test nào).
#
# Job "lint" và "security" chạy SONG SONG, job "test" chỉ chạy khi cả hai xanh
# (needs): no-undef chặn ngay loại bug thiếu import / biến chưa khai báo — crash
# runtime mà test có thể không đụng tới. "security": gitleaks chặn token/khóa lộ
# trong code, bun audit chặn CVE critical (high/moderate chỉ cảnh báo — tránh block vì advisory không
# ảnh hưởng runtime như dev-server-only).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Quyền tối thiểu cho mọi job; job nào cần hơn thì tự khai bên dưới.
permissions:
  contents: read

# Đẩy commit mới lên PR thì huỷ lượt chạy cũ (mỗi lượt tốn vài phút runner).
# Push lên main KHÔNG bị huỷ: deploy Convex không được bỏ dở giữa chừng.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action có thể bình luận lên PR — giữ đúng quyền mặc định cũ của job này.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks quét toàn bộ lịch sử commit
      - uses: oven-sh/setup-bun@v2
      - name: Gitleaks — quét secret/token trong lịch sử git
        # PR từ Dependabot dùng GITHUB_TOKEN bị giới hạn quyền (chỉ read) —
        # API của gitleaks-action bị từ chối "Resource not accessible by
        # integration" và làm đỏ cả PRdeps không liên quan. Nhánh CLI chạy
        # gitleaks trực tiếp (không gọi GitHub API): vẫn quét full lịch sử,
        # thiếu hẳn phần affiliate/check-for-leaks của action.
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Gitleaks (CLI) — quét secret cho PR Dependabot
        if: github.actor == 'dependabot[bot]'
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --redact -v --exit-code 1 .
      - name: Bun audit — chặn CVE mức critical (high/moderate chỉ cảnh báo)
        run: |
          bun install --frozen-lockfile
          (cd bot && bun install --frozen-lockfile)
          echo "### 📋 Dependency audit" >> "$GITHUB_STEP_SUMMARY"
          status=0
          # Audit CẢ hai lockfile: bot/bun.lock (discord.js, canvas — cây chạy production
          # trên VPS) trước đây không bao giờ được quét.
          for dir in . bot; do
            out="/tmp/audit-$(echo "$dir" | tr './' '__').txt"
            (cd "$dir" && bun audit) > "$out" 2>&1 || true
            { echo "**\`$dir\`**"; echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            # FAIL-CLOSED: bun audit hỏng (registry/mạng) thì không in dòng tổng kết —
            # trước đây trường hợp đó vẫn báo "✅ Không có CVE critical".
            if ! grep -qE "No vulnerabilities found|[0-9]+ vulnerabilit" "$out"; then
              echo "::error::bun audit không chạy được ở '$dir' (không có dòng tổng kết) — không thể khẳng định sạch"
              status=1
              continue
            fi
            # Parse output text thay vì flag --level: cú pháp bun audit đổi giữa
            # các version (1.3 nhận --level, 1.4 không) — dòng tổng kết dạng
            # "N vulnerabilities (x critical, y high, ...)" ổn định trên mọi version.
            if grep -qE "[1-9][0-9]* critical" "$out"; then
              echo "::error::Có CVE mức critical ở '$dir' — bắt buộc phải vá trước khi merge"
              status=1
            fi
          done
          [ "$status" -eq 0 ] && echo "✅ Không có CVE critical (root + bot)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: ESLint (no-undef chặn bug thiếu import trước cả khi chạy test)
        run: bun run lint
      - name: Prettier (format thống nhất)
        run: bun run format:check
      # docs/repo-map.md là bản đồ agent đọc đầu mỗi phiên — chặn nó lệch
      # thực tế (thêm/xoá trang, panel, module bot, Convex function mà quên
      # cập nhật bản đồ) ngay tại CI, rẻ hơn để agent phiên sau đi lạc.
      - name: Repo map khớp cấu trúc thật (docs/repo-map.md)
        run: node scripts/check-repo-map.cjs
      # Bot gọi Convex bằng tên chuỗi — tsc không phủ được. Đổi tên/di chuyển
      # function Convex mà quên cập nhật bot/src → bot crash runtime dù CI
      # xanh. Chặn ở lint (rẻ, chạy trước test).
      - name: Hợp đồng bot ⇄ Convex (tên function tồn tại 2 phía)
        run: node scripts/check-convex-contract.cjs
      # Chuỗi VI trong code là key của từ điển EN — thiếu bản dịch thì UI vẫn
      # chạy nhưng người dùng EN đọc tiếng Việt (lỗi im lặng). Chặn ở lint.
      # --self-test: dựng lại từng bug thật trong thư mục tạm để chứng minh cổng
      # không mù và không báo nhầm (cổng luôn xanh thì vô dụng).
      - name: Đa ngôn ngữ (mọi chuỗi người dùng có bản EN)
        run: node scripts/check-i18n.cjs --self-test
      # Bot cache bundle cấu hình của guild 30 phút (cắt reads). Mutation nào ghi
      # field bot đọc mà không đánh tín hiệu thì thay đổi từ dashboard "đứng im"
      # tới 30 phút dù giao diện hứa ~3 phút — bug thật 23/09/2026 (welcome/goodbye
      # + 9 chỗ cùng lớp). Cổng cũng đối chiếu 2 chiều danh sách
      # CONFIG_WRITE_MUTATIONS phía bot với convex/bot_writes.ts, và tự kiểm bằng
      # --self-test (dựng lại đúng các bug thật để chứng minh không mù).
      - name: Tín hiệu cấu hình dashboard ⇄ bot (thay đổi không được "đứng im")
        run: node scripts/check-settings-signal.cjs --self-test
      # Cron Convex chạy ở môi trường KHÔNG có tiến trình bot. Cron chỉ được
      # TÍNH + ĐẶT CỜ; việc chạm Discord/RAM/đĩa thuộc bot. Một cron "thông
      # minh" (tự gửi embed, tự ghi trạng thái bot) không chỉ hỏng mà hỏng
      # ÂM THẦM — cổng chặn ngay ở lint, kèm --self-test dựng lại từng cách phá
      # ranh giới trên nguồn thật.
      - name: Ranh giới cron (chỉ đặt cờ, không gọi hàm bot/không ghi state bot)
        run: node scripts/check-cron-boundary.cjs --self-test
      # Quyết định "timer mới phải vào sweeper chung, không tự dựngsetInterval"
      # chỉ sống trong tài liệu thì không giữ được: chỉ cần một module mới tự dựng
      # timer là lùi kiến trúc mà không ai thấy. Allowlist so HAI CHIỀU (thêm và
      # xoá) nên timer chỉ giảm được sau khi review.
      - name: Allowlist setInterval (timer mới phải qua review, không tự dựng)
        run: node scripts/check-timer-allowlist.cjs --self-test

  test:
    needs: [lint, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Cài dependencies (root + bot — 4 suites cần discord.js thật)
        run: |
          bun install --frozen-lockfile
          (cd bot && bun install --frozen-lockfile)
      # Test trình duyệt thật (scripts/test-browser-contracts.cjs) điều khiển
      # Chromium bằng DevTools Protocol — KHÔNG cài dependency nào vào repo,
      # nhưng cần một bản Chromium chạy được. Runner Ubuntu chỉ có snap-stub
      # chromium-browser (không dùng được trong service), nên tải bản
      # playwright về cache nếu chưa có. Thiếu Chromium = test FAIL kèm hướng
      # dẫn (không im lặng xanh).
      - name: Cache Chromium của playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.63.0-${{ runner.os }}
      - name: Bảo đảm có Chromium cho test trình duyệt
        run: |
          if ! ls -d "$HOME"/.cache/ms-playwright/chromium-* >/dev/null 2>&1; then
            echo "Chưa có Chromium — tải về ~/.cache/ms-playwright"
            bunx playwright@1.63.0 install chromium
          else
            echo "Đã có Chromium trong cache playwright"
          fi
      - name: Typecheck (web + convex)
        run: bun run typecheck
      - name: Chạy toàn bộ test suites + đo coverage (c8)
        # Trần mặc định 120s/suite không đủ cho test-browser-contracts: suite
        # này điều khiển Chromium thật nên thời gian phụ thuộc tốc độ runner.
        # Đo thực tế trên ubuntu-latest: 87,3s · 91,2s · 98,2s · 100,5s (xanh)
        # nhưng 2 lần vượt 120s (đỏ) → không có biên an toàn, chỉ chờ vận may.
        # 300s vẫn dưới trần job (30 phút) và vẫn bắt được treo thật.
        env:
          TEST_SUITE_TIMEOUT_MS: "300000"
        run: bun run test:coverage
      # 5 suite tầng Convex/Haimiya viết bằng TypeScript — trước đây không
      # runner nào chạy (test có mà không bao giờ chạy).
      - name: Test tầng Convex/Haimiya (suite .ts)
        env:
          TEST_SUITE_TIMEOUT_MS: "300000"
        run: bun run test:ts
      - name: Sàn coverage theo file — engine bảo vệ không được tụt
        run: bun run coverage:floor
      - name: Mutation test — mutants phải bị giết hết (test không lỏng)
        run: bun run test:mutation
      # ĐỘ CHÍNH XÁC AI trên key THẬT (đợt #2). Chỉ chạy khi repo CÓ secret
      # provider; không có thì bỏ qua chứ không đỏ. Lý do không cho nó là cổng
      # cứng mặc định: độ chính xác phụ thuộc chuỗi provider BÊN NGOÀI (429/hết
      # hạn mức làm `offline`), nên bắt đỏ theo nó là bắt đỏ oan. Muốn chặt
      # thì bật `AI_EVAL_GATE=1` sau khi đã cấu hình secret.
      - name: Đánh giá AI chống raid (live — bỏ qua nếu thiếu key provider)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIRA_API_KEY: ${{ secrets.KIRA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/test-ai-raid-eval.mjs
      - name: Tóm tắt coverage vào Job Summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## 📊 Coverage" >> $GITHUB_STEP_SUMMARY
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const pct = (n) => n.pct + '%';
              console.log('| Chỉ số | Giá trị |');
              console.log('|---|---|');
              console.log('| Statements | ' + pct(s.statements) + ' |');
              console.log('| Branches | ' + pct(s.branches) + ' |');
              console.log('| Functions | ' + pct(s.functions) + ' |');
              console.log('| Lines | ' + pct(s.lines) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload báo cáo HTML (xem local bằng artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Deploy Convex chỉ chạy KHI lint + security + test đã pass — tách job, depends_on cả ba.
  deploy:
    needs: [lint, security, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Hai lượt deploy không được chồng nhau, và cũng không huỷ lượt đang chạy.
    concurrency:
      group: convex-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Deploy to Convex production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Thiếu secret CONVEX_DEPLOY_KEY — vào GitHub repo → Settings → Secrets and variables → Actions → New repository secret → tên CONVEX_DEPLOY_KEY → dán key tạo ở Convex dashboard (Deployment settings → Deploy keys → Generate, bật deployment:deploy)."
            exit 1
          fi
          npx convex deploy
